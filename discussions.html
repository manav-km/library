<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussions — SAJS Library Site</title>
  <link rel="icon" type="image/jpeg" href="assets/image.jpeg">
  <link rel="shortcut icon" href="assets/image.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .chat-bubble-container:hover .msg-actions {
      display: flex !important;
    }
  </style>
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="app-main">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Public · book & community threads</span>
          <h1 style="margin:0; font-size:var(--fs-h2);">Discussions</h1>
        </div>
        <button class="btn btn-primary" id="create-thread-btn">+ Start discussion</button>
      </div>

      <div class="genre-chip-row" id="discussion-genre-chips" style="margin-bottom:var(--sp-4);">
        <button class="genre-chip active" data-genre="all">All discussions</button>
      </div>

      <div class="discussion-shell card" style="padding:0; overflow:hidden;">
        <div class="thread-list" style="padding:var(--sp-4); border-right:1px solid var(--glass-border);" id="thread-list">
          <div class="skeleton" style="height:56px; margin-bottom:var(--sp-2);"></div>
          <div class="skeleton" style="height:56px; margin-bottom:var(--sp-2);"></div>
          <div class="skeleton" style="height:56px;"></div>
        </div>

        <div class="chat-panel">
          <div style="padding:var(--sp-4); border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
            <div>
              <h4 id="thread-title" style="margin:0;">Select a discussion thread</h4>
              <span class="text-tertiary" id="thread-subtitle" style="font-size:var(--fs-tiny);"></span>
            </div>
            <div id="thread-actions-container" style="display:none; align-items:center; gap:var(--sp-2);">
              <button class="btn btn-ghost btn-sm" id="disc-members-btn" title="View Senders" style="padding:6px 10px; font-size:16px;">👤</button>
              <button class="btn btn-ghost btn-sm" id="disc-bulk-delete-btn" title="Delete Messages" style="padding:6px 10px; font-size:16px;">🗑️</button>
              <button class="btn btn-danger btn-sm" id="disc-bulk-confirm-btn" style="display:none; padding:6px 10px; font-size:12px; font-weight:600;">Delete Selected</button>
              <button class="btn btn-danger btn-sm" id="disc-delete-btn" title="Delete entire discussion" style="padding:6px 12px; font-size:12px; font-weight:600;">Delete Discussion</button>
            </div>
          </div>
          <div class="chat-scroll" id="chat-scroll"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Write a message..." disabled>
            <button class="btn btn-primary" id="chat-send-btn" disabled>Send</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ Start Discussion Modal ============ -->
  <div class="modal-overlay" id="create-thread-modal">
    <div class="modal" style="max-width:500px;">
      <h3>Start a new discussion</h3>
      <form id="create-thread-form">
        <div class="field">
          <label for="thread-topic-title">Discussion Topic / Book Title</label>
          <input type="text" id="thread-topic-title" placeholder="e.g. Character Motivations in To Kill a Mockingbird" required>
        </div>
        <div class="field">
          <label for="thread-first-msg">Opening Message</label>
          <textarea id="thread-first-msg" rows="3" placeholder="What would you like to discuss with the school community?" required></textarea>
        </div>
        <div class="flex gap-3" style="margin-top:var(--sp-5);">
          <button type="button" class="btn btn-ghost btn-block" id="cancel-thread-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Post discussion</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ Discussion Members Modal ============ -->
  <div class="modal-overlay" id="discussion-members-modal">
    <div class="modal" style="max-width:450px;">
      <h3 style="margin-bottom:var(--sp-4);">Members in this Discussion</h3>
      <div id="discussion-members-list" class="stack gap-3" style="max-height:40vh; overflow-y:auto; margin-bottom:var(--sp-4);">
        <!-- Dynamic list of members -->
      </div>
      <button type="button" class="btn btn-ghost btn-block" id="close-members-modal">Close</button>
    </div>
  </div>

  <!-- ============ Delete Discussion Modal ============ -->
  <div class="modal-overlay" id="delete-discussion-modal">
    <div class="modal" style="max-width:500px;">
      <h3 id="delete-disc-title" style="margin-bottom:var(--sp-4); font-size:1.2rem; font-weight:700;">Are you sure you want to delete <span id="delete-disc-name-placeholder" style="font-weight:bold;"></span>?</h3>
      <p class="text-danger" style="margin-bottom:var(--sp-4); font-weight:600; font-size:var(--fs-small);">Warning: If you proceed with the deletion of this discussion, it can not be reversed later.</p>
      
      <form id="delete-discussion-form">
        <div class="field">
          <label for="delete-disc-reason-input">Enter the reason of deletion below</label>
          <input type="text" id="delete-disc-reason-input" placeholder="e.g. Inappropriate content" required>
        </div>
        <div class="field">
          <label for="delete-disc-heading-input">To delete, please type the discussion heading into the box below</label>
          <input type="text" id="delete-disc-heading-input" placeholder="Type discussion title exactly" required>
        </div>
        <div class="flex gap-3" style="margin-top:var(--sp-5);">
          <button type="button" class="btn btn-ghost btn-block" id="cancel-delete-disc-modal">Cancel</button>
          <button type="submit" class="btn btn-danger btn-block" id="confirm-delete-disc-btn">Delete Discussion</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/discussions.js"></script>
</body>
</html>
