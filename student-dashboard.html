<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SAJS Digital Library</title>
  <link rel="icon" type="image/jpeg" href="assets/image.jpeg">
  <link rel="shortcut icon" href="assets/image.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="app-main">
    <div class="container">
      <div class="grid grid-sidebar">

        <!-- ============ Profile card ============ -->
        <div class="stack">
          <div class="card profile-card" id="profile">
            <div class="avatar avatar-lg" id="profile-avatar">S</div>
            <h3 id="profile-name" style="margin-bottom:2px;">—</h3>
            <span class="badge badge-role-student" id="profile-role">Student</span>
            <p class="text-tertiary" id="profile-class" style="margin-top:var(--sp-3); font-size:var(--fs-small);">—</p>
            <p id="profile-bio" style="font-size:var(--fs-small);">—</p>
            <div class="stat-row">
              <div class="stat"><strong id="stat-reviews">0</strong><span>Reviews</span></div>
              <div class="stat"><strong id="stat-viewed">0</strong><span>Books viewed</span></div>
            </div>
            <button class="btn btn-ghost btn-block" style="margin-top:var(--sp-5);" id="edit-profile-btn">Edit profile</button>
          </div>

          <div class="card">
            <h4>Favourite genre</h4>
            <div class="spine-tag" id="fav-genre-tag" style="font-size:var(--fs-small); padding:8px 16px 8px 10px;">—</div>
          </div>

          <div class="card">
            <h4>Quick access</h4>
            <div class="stack" id="quick-access-list" style="margin-top:0;">
              <a href="library.html" class="btn btn-ghost btn-block">Browse library</a>
              <a href="discussions.html" class="btn btn-ghost btn-block">Join discussions</a>
            </div>
          </div>
        </div>

        <!-- ============ Main column ============ -->
        <div class="stack">
          <section class="card">
            <div class="section-head">
              <h3 style="margin:0;">Recently viewed</h3>
              <a href="library.html">Browse more →</a>
            </div>
            <div class="mini-book-row" id="recent-viewed"></div>
          </section>

          <section class="card">
            <div class="section-head">
              <h3 style="margin:0;">Your reviews</h3>
            </div>
            <div id="my-reviews"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ Edit profile modal ============ -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal" style="max-width:540px; max-height:85vh; overflow-y:auto;">
      <h3>Edit profile</h3>
      <form id="edit-profile-form">
        <div class="field">
          <label for="edit-uid">User ID (UID)</label>
          <input type="text" id="edit-uid" class="mono" readonly disabled>
          <div class="field-hint">Assigned automatically by Firebase Authentication — Permanent ID.</div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="edit-name">Full name</label>
            <input type="text" id="edit-name" required>
          </div>
          <div class="field">
            <label for="edit-email">Email address</label>
            <input type="email" id="edit-email" required>
          </div>
        </div>

        <!-- Student specific fields -->
        <div class="field-row" id="student-edit-fields">
          <div class="field">
            <label for="edit-class">Class</label>
            <input type="text" id="edit-class" placeholder="e.g. 10">
          </div>
          <div class="field">
            <label for="edit-section">Section</label>
            <input type="text" id="edit-section" placeholder="e.g. A">
          </div>
          <div class="field">
            <label for="edit-roll">Roll No.</label>
            <input type="text" id="edit-roll" placeholder="e.g. 14">
          </div>
        </div>

        <!-- Teacher specific fields -->
        <div class="field" id="teacher-edit-fields" style="display:none;">
          <label for="edit-subject">Teaching subject</label>
          <input type="text" id="edit-subject" placeholder="e.g. English Literature">
        </div>

        <div class="field">
          <label for="edit-genre">Favourite genre</label>
          <select id="edit-genre">
            <option>Action</option>
            <option>Adventure</option>
            <option>Art</option>
            <option>Biography &amp; Memoir</option>
            <option>Business</option>
            <option>Children's</option>
            <option>Classics</option>
            <option>Comedy</option>
            <option>Crafts &amp; DIY</option>
            <option>Crime</option>
            <option>Drama &amp; Romance</option>
            <option>Dystopian</option>
            <option>Fairy Tales</option>
            <option>Fantasy</option>
            <option>Fiction</option>
            <option>Finance</option>
            <option>Folklore</option>
            <option>Games &amp; Gaming</option>
            <option>Graphic Novels &amp; Comics</option>
            <option>Health &amp; Wellness</option>
            <option>Hindi</option>
            <option>Historical Fiction</option>
            <option>History</option>
            <option>Horror</option>
            <option>Humor</option>
            <option>Inspirational</option>
            <option>Journalism</option>
            <option>Language Learning</option>
            <option>Manga</option>
            <option>Mathematics</option>
            <option>Music</option>
            <option>Mystery &amp; Thriller</option>
            <option>Mythology</option>
            <option>Nature</option>
            <option>Non-Fiction</option>
            <option>Performing Arts</option>
            <option>Philosophy &amp; Ethics</option>
            <option>Photography</option>
            <option>Poetry &amp; Plays</option>
            <option>Reference</option>
            <option>Religion</option>
            <option>School Life</option>
            <option>Science &amp; Technology</option>
            <option>Science Fiction</option>
            <option>Self-Help &amp; Psychology</option>
            <option>Short Stories</option>
            <option>Social Science</option>
            <option>Space</option>
            <option>Spirituality</option>
            <option>Sports</option>
            <option>Survival</option>
            <option>Textbooks</option>
            <option>Travel</option>
            <option>War</option>
            <option>Western</option>
            <option>Wildlife</option>
            <option>Young Adult (YA)</option>
          </select>
        </div>

        <div class="field">
          <label for="edit-bio">About me</label>
          <textarea id="edit-bio" rows="3" placeholder="Tell others what you like to read..."></textarea>
        </div>

        <div class="field">
          <label for="edit-avatar">Profile picture</label>
          <input type="file" id="edit-avatar" accept="image/*">
        </div>

        <div class="flex gap-3" style="margin-top:var(--sp-5);">
          <button type="button" class="btn btn-ghost btn-block" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/student-dashboard.js"></script>
</body>
</html>
