<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — SAJS Library Site</title>
  <link rel="icon" type="image/jpeg" href="assets/image.jpeg">
  <link rel="shortcut icon" href="assets/image.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="app-main">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Full catalogue</span>
          <h1 style="margin:0; font-size:var(--fs-h2);">Library</h1>
        </div>
        <button class="btn btn-primary" id="upload-book-btn" style="display:none;">+ Upload Book</button>
      </div>

      <div class="library-toolbar">
        <div class="search-field">
          <span class="icon">🔎</span>
          <input type="text" id="search-input" placeholder="Search by title, author, or catalogue ID (e.g. SAJS-001)...">
        </div>
      </div>

      <div class="genre-chip-row" id="genre-chips">
        <button class="genre-chip active" data-genre="all">All genres</button>
        <!-- Populated with genres present in the catalogue -->
      </div>

      <div id="results-count" class="text-tertiary" style="font-size:var(--fs-small); margin-bottom:var(--sp-4);"></div>

      <div class="books-grid" id="library-grid">
        <div class="skeleton" style="height:260px;"></div>
        <div class="skeleton" style="height:260px;"></div>
        <div class="skeleton" style="height:260px;"></div>
        <div class="skeleton" style="height:260px;"></div>
        <div class="skeleton" style="height:260px;"></div>
        <div class="skeleton" style="height:260px;"></div>
      </div>
    </div>
  </main>

  <!-- ============ Upload Book Modal ============ -->
  <div class="modal-overlay" id="book-modal">
    <div class="modal" style="max-width:640px; max-height:85vh; overflow-y:auto;">
      <h3 id="book-modal-title">Upload book</h3>
      <form id="book-form">
        <input type="hidden" id="book-doc-id">
        <div class="field">
          <label>Catalogue ID</label>
          <input type="text" id="f-bkid" class="mono" readonly>
          <div class="field-hint">Assigned automatically — SAJS is the permanent school prefix.</div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-name">Book name</label><input type="text" id="f-name" required></div>
          <div class="field"><label for="f-author">Author</label><input type="text" id="f-author" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-year">Publication year</label><input type="number" id="f-year" required></div>
          <div class="field">
            <label for="f-genre">Genre</label>
            <select id="f-genre">
              <option>Action &amp; Adventure</option>
              <option>Biography &amp; Memoir</option>
              <option>Children's &amp; Middle Grade</option>
              <option>Classics</option>
              <option>Comics &amp; Graphic Novels</option>
              <option>Drama &amp; Romance</option>
              <option>Fantasy</option>
              <option>Fiction</option>
              <option>History &amp; Politics</option>
              <option>Horror &amp; Dark Fiction</option>
              <option>Humor &amp; Satire</option>
              <option>Mystery &amp; Thriller</option>
              <option>Non-Fiction</option>
              <option>Philosophy &amp; Ethics</option>
              <option>Poetry &amp; Plays</option>
              <option>Religion & Spirituality</option>
              <option>Science & Technology</option>
              <option>Dystopian</option>
              <option>Self-Help & Psychology</option>
              <option>Young Adult (YA)</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="f-cover">Cover image</label><input type="file" id="f-cover" accept="image/*"></div>
        <div class="field"><label for="f-pages">Total pages <span style="color:var(--danger);">*</span></label><input type="number" id="f-pages" min="1" required placeholder="e.g. 320"><div class="field-hint">Required for the reading progress tracker.</div></div>
        <div class="field"><label for="f-mainidea">Main idea</label><textarea id="f-mainidea" rows="2" required></textarea></div>
        <div class="field"><label for="f-themes">Themes (comma-separated)</label><input type="text" id="f-themes" placeholder="Memory, Isolation, Truth"></div>
        <div class="field"><label for="f-characters">Characters (one per line: Name | Role | Note)</label><textarea id="f-characters" rows="3" placeholder="Elias Kade | Lighthouse keeper | Meticulous and guarded"></textarea></div>
        <div class="field"><label for="f-setting">Setting</label><textarea id="f-setting" rows="2"></textarea></div>
        <div class="field"><label for="f-plot">Plot</label><textarea id="f-plot" rows="3"></textarea></div>
        <div class="field"><label for="f-conflict">Conflict</label><textarea id="f-conflict" rows="2"></textarea></div>
        <div class="field"><label for="f-resolution">Resolution</label><textarea id="f-resolution" rows="2"></textarea></div>
        <div class="field"><label for="f-moral">Moral / Lesson</label><textarea id="f-moral" rows="2"></textarea></div>
        <div class="field"><label for="f-summary">Summary</label><textarea id="f-summary" rows="3" required></textarea></div>

        <div class="flex gap-3" style="margin-top:var(--sp-5);">
          <button type="button" class="btn btn-danger" id="delete-book-modal-btn" style="display:none;">Delete book</button>
          <button type="button" class="btn btn-ghost btn-block" id="cancel-book-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save book</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/library.js"></script>
</body>
</html>
