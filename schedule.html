<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — SAJS Digital Library</title>
  <link rel="icon" type="image/jpeg" href="assets/image.jpeg">
  <link rel="shortcut icon" href="assets/image.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="app-main">
    <div class="container">
      <div class="section-head" style="margin-bottom:var(--sp-4);">
        <div>
          <span class="eyebrow">Weekly Timetable</span>
          <h1 style="margin:0; font-size:var(--fs-h2);">Library Schedule</h1>
          <p class="text-tertiary" style="margin-top:4px; font-size:var(--fs-small);" id="schedule-week-range">
            Weekly library period allocations (resets every Monday).
          </p>
        </div>
        <button id="open-schedule-modal-btn" class="btn btn-primary hidden">
          <span>➕</span> Add Period
        </button>
      </div>

      <div class="schedule-table-wrap">
        <table class="schedule-table" id="schedule-table">
          <thead>
            <tr>
              <th>Day</th>
              <th>1st Period</th>
              <th>2nd Period</th>
              <th>3rd Period</th>
              <th>4th Period</th>
              <th>5th Period</th>
              <th>6th Period</th>
              <th>7th Period</th>
              <th>8th Period</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Period Modal -->
  <div class="modal-overlay" id="schedule-modal" style="display:none; z-index:1000;">
    <div class="modal-card" style="max-width: 540px; background:var(--bg-elevated); border:1px solid var(--glass-border-hi); border-radius:var(--radius-lg); padding:var(--sp-6);">
      <div class="modal-header flex items-center justify-between" style="margin-bottom:var(--sp-4);">
        <h2 style="margin:0; font-size:var(--fs-h3);">Add Library Period</h2>
        <button type="button" class="icon-btn close-modal" style="background:none; border:none; color:var(--text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="schedule-form">
        <div class="form-group" style="margin-bottom:var(--sp-4); background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:var(--radius-md); padding:10px 14px;">
          <label class="flex items-center gap-2" style="cursor:pointer; margin:0; font-weight:600; color:#f59e0b;">
            <input type="checkbox" id="p-is-holiday" style="width:18px; height:18px; accent-color:#f59e0b;">
            <span>🌴 Mark this day / period as a Holiday</span>
          </label>
        </div>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4);">
          <div class="form-group">
            <label for="p-date">Date</label>
            <input type="date" id="p-date" required>
          </div>
          <div class="form-group">
            <label for="p-day">Day</label>
            <select id="p-day" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>
        </div>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-4); margin-top:var(--sp-3);">
          <div class="form-group">
            <label for="p-period">Period</label>
            <select id="p-period" required>
              <option value="All Periods">All Periods (Full Day)</option>
              <option value="1st Period">1st Period</option>
              <option value="2nd Period">2nd Period</option>
              <option value="3rd Period">3rd Period</option>
              <option value="4th Period">4th Period</option>
              <option value="5th Period">5th Period</option>
              <option value="6th Period">6th Period</option>
              <option value="7th Period">7th Period</option>
              <option value="8th Period">8th Period</option>
            </select>
          </div>
          <div class="form-group" id="group-grade-box">
            <label for="p-grade">Grade</label>
            <select id="p-grade">
              <option value="Grade 1">Grade 1</option>
              <option value="Grade 2">Grade 2</option>
              <option value="Grade 3">Grade 3</option>
              <option value="Grade 4">Grade 4</option>
              <option value="Grade 5">Grade 5</option>
              <option value="Grade 6">Grade 6</option>
              <option value="Grade 7">Grade 7</option>
              <option value="Grade 8">Grade 8</option>
              <option value="Grade 9">Grade 9</option>
              <option value="Grade 10" selected>Grade 10</option>
              <option value="Grade 11">Grade 11</option>
              <option value="Grade 12">Grade 12</option>
            </select>
          </div>
          <div class="form-group" id="group-section-box">
            <label for="p-section">Section</label>
            <select id="p-section">
              <option value="A">Section A</option>
              <option value="B">Section B</option>
              <option value="C">Section C</option>
              <option value="D">Section D</option>
              <option value="E">Section E</option>
              <option value="F">Section F</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="group-teacher-box" style="margin-top:var(--sp-3);">
          <label for="p-teacher">Teacher Taking Class</label>
          <input type="text" id="p-teacher" placeholder="e.g. Mrs. Ananya Sharma">
        </div>

        <div class="form-group" id="group-genre-box" style="margin-top:var(--sp-3);">
          <label for="p-genre">Shelf / Genre to Read</label>
          <select id="p-genre">
            <!-- Populated dynamically with ALL_GENRES -->
          </select>
        </div>

        <div class="form-group" style="margin-top:var(--sp-3);">
          <label for="p-activity">Assignments / Activities / Holiday Note</label>
          <textarea id="p-activity" rows="3" placeholder="e.g. Chapter 4 reading, book review notes, or School Holiday reason..."></textarea>
        </div>

        <div class="modal-actions" style="margin-top:var(--sp-5); justify-content:flex-end;">
          <button type="button" class="btn btn-tertiary close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Period</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/schedule.js"></script>
</body>
</html>
