<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Timetable - SAJS Digital Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .timetable-wrap {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
    }

    .timetable {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    .timetable th,
    .timetable td {
      border: 1px solid var(--glass-border);
      padding: 10px 8px;
      text-align: center;
      vertical-align: top;
      font-size: var(--fs-tiny);
    }

    .timetable th {
      background: var(--bg-sunken);
      color: var(--cyan-300);
      font-family: var(--font-mono);
      font-weight: 600;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timetable td.day-cell {
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 700;
      font-family: var(--font-mono);
      vertical-align: middle;
      white-space: nowrap;
      width: 110px;
    }

    .slot-box {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
      text-align: left;
      transition: all var(--dur-fast) var(--ease-standard);
      position: relative;
    }

    .slot-box:hover {
      border-color: var(--indigo-400);
      box-shadow: var(--shadow-glow-indigo);
    }

    .slot-box.holiday {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .slot-box.substitution {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .past-planner-item {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--glass-border);
    }

    .past-planner-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
  </style>
</head>

<body>
  <!-- Global Navigation Header -->
  <div id="navbar-mount"></div>

  <main class="page-container fade-in">
    <!-- Header Hero Banner -->
    <header class="flex justify-between items-center mb-6" style="flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--text-primary), var(--cyan-300)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          📅 Weekly Library Timetable
        </h1>
        <p class="text-secondary" style="font-size: var(--fs-small); margin-top: 4px;" id="current-week-label">
          Active Weekly Schedule
        </p>
      </div>

      <div class="flex items-center gap-3">
        <button class="btn btn-ghost" id="open-past-schedules-btn">
          📜 View Past Schedules
        </button>
        <button class="btn btn-primary" id="open-add-schedule-btn" style="display: none;">
          ➕ Add / Edit Slot
        </button>
      </div>
    </header>

    <!-- Filters Bar -->
    <div class="glass-card mb-6" style="padding: 14px 20px;">
      <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 16px;">
        <div class="flex items-center gap-3">
          <label for="filter-class" style="font-size: var(--fs-small); color: var(--text-tertiary); font-weight: 600;">Filter Class:</label>
          <select id="filter-class" class="input" style="width: auto; padding: 6px 14px; font-size: var(--fs-small);">
            <option value="ALL">All Classes</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>

        <div class="text-tertiary" style="font-size: var(--fs-tiny);" id="week-date-range">
          <!-- Active Week Monday – Saturday -->
        </div>
      </div>
    </div>

    <!-- Active Timetable (6 Rows x 8 Columns) -->
    <section class="timetable-wrap">
      <table class="timetable">
        <thead>
          <tr>
            <th style="width: 110px;">Day</th>
            <th>Period 1</th>
            <th>Period 2</th>
            <th>Period 3</th>
            <th>Period 4</th>
            <th>Period 5</th>
            <th>Period 6</th>
            <th>Period 7</th>
            <th>Period 8</th>
          </tr>
        </thead>
        <tbody id="active-timetable-body">
          <tr><td colspan="9" style="padding: 30px; color: var(--text-tertiary);">Loading weekly timetable...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal: Add / Edit Schedule Slot (Staff Only) -->
  <div class="modal-overlay" id="add-schedule-modal">
    <div class="modal" style="max-width: 540px;">
      <h3 style="margin-bottom: var(--sp-4);">➕ Fill Timetable Slot</h3>
      <form id="add-schedule-form">
        <div class="grid gap-4" style="grid-template-columns: 1fr 1fr;">
          <div class="form-group">
            <label class="form-label" for="sched-date">Date *</label>
            <input type="date" id="sched-date" class="input" required>
            <div id="auto-day-display" style="font-size: var(--fs-tiny); color: var(--cyan-300); margin-top: 4px; font-weight: 600;">Day: Auto Detected</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="sched-period">Period Number *</label>
            <select id="sched-period" class="input" required>
              <option value="Period 1">Period 1</option>
              <option value="Period 2">Period 2</option>
              <option value="Period 3">Period 3</option>
              <option value="Period 4">Period 4</option>
              <option value="Period 5">Period 5</option>
              <option value="Period 6">Period 6</option>
              <option value="Period 7">Period 7</option>
              <option value="Period 8">Period 8</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label" for="sched-type">Slot Status Type *</label>
          <select id="sched-type" class="input" required>
            <option value="normal">Regular Class Period</option>
            <option value="holiday">🏖️ Holiday / Closed</option>
            <option value="substitution">🔄 Substitution Period</option>
          </select>
        </div>

        <div id="normal-slot-fields">
          <div class="grid gap-4" style="grid-template-columns: 1fr 1fr; margin-top: 12px;">
            <div class="form-group">
              <label class="form-label" for="sched-class">Class / Grade *</label>
              <input type="text" id="sched-class" class="input" placeholder="e.g. 8">
            </div>

            <div class="form-group">
              <label class="form-label" for="sched-section">Section *</label>
              <input type="text" id="sched-section" class="input" placeholder="e.g. D">
            </div>
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label" for="sched-teacher">Assigned Teacher *</label>
            <input type="text" id="sched-teacher" class="input" placeholder="e.g. Ms. Sharma">
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label" for="sched-genre">Target Genre / Shelf Focus</label>
            <select id="sched-genre" class="input">
              <option value="General Reading">General Reading</option>
              <option value="Fiction">Fiction</option>
              <option value="Science Fiction">Science Fiction</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Mystery">Mystery</option>
              <option value="Non-Fiction">Non-Fiction</option>
              <option value="History">History</option>
              <option value="Biography">Biography</option>
              <option value="Poetry">Poetry</option>
              <option value="Comics & Graphic Novels">Comics & Graphic Novels</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label" for="sched-notes">Any Notes / Remarks?</label>
          <textarea id="sched-notes" class="input" rows="2" placeholder="e.g. Substitute teacher handling Class 9-A"></textarea>
        </div>

        <div class="flex gap-3 justify-end" style="margin-top: var(--sp-5);">
          <button type="button" class="btn btn-ghost" id="close-sched-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-sched-btn">Save Timetable Slot</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: View Past Schedules -->
  <div class="modal-overlay" id="past-schedules-modal">
    <div class="modal" style="max-width: 960px; max-height: 85vh; display: flex; flex-direction: column;">
      <div class="flex justify-between items-center mb-4">
        <h3>📜 Previous Weekly Planners</h3>
        <button class="btn btn-ghost btn-sm" id="close-past-modal" style="font-size: 1.2rem;">✕</button>
      </div>

      <div id="past-planners-container" style="overflow-y: auto; flex: 1; padding-right: 8px;">
        <!-- Iterated weekly planners will mount here -->
      </div>
    </div>
  </div>

  <!-- Page Logic Script -->
  <script type="module" src="js/pages/schedule.js"></script>
</body>

</html>
