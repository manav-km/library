<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard — SAJS Digital Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="app-main">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow" id="teacher-eyebrow">Teacher tools</span>
          <h1 style="margin:0; font-size:var(--fs-h2);" id="teacher-name">—</h1>
        </div>
        <button class="btn btn-primary" id="add-book-btn">+ Add book</button>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="catalogue">Catalogue</div>
        <div class="tab" data-tab="reviews">Review moderation</div>
      </div>

      <!-- ============ Catalogue management ============ -->
      <section id="tab-catalogue">
        <div class="card table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>ID</th><th>Title</th><th>Author</th><th>Genre</th><th></th></tr>
            </thead>
            <tbody id="books-table-body"></tbody>
          </table>
        </div>
      </section>

      <!-- ============ Review moderation ============ -->
      <section id="tab-reviews" style="display:none;">
        <div class="card" id="moderation-list"></div>
      </section>
    </div>
  </main>

  <!-- ============ Add / edit book modal ============ -->
  <div class="modal-overlay" id="book-modal">
    <div class="modal" style="max-width:640px; max-height:85vh; overflow-y:auto;">
      <h3 id="book-modal-title">Add book</h3>
      <form id="book-form">
        <input type="hidden" id="book-doc-id">
        <div class="field">
          <label>Catalogue ID</label>
          <input type="text" id="f-bkid" class="mono" readonly>
          <div class="field-hint">Assigned automatically — SAJS is the permanent school prefix.</div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-name">Book name</label><input type="text" id="f-name" required></div>
          <div class="field"><label for="f-author">Author</label><input type="text" id="f-author" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-year">Publication year</label><input type="number" id="f-year" required></div>
          <div class="field">
            <label for="f-genre">Genre</label>
            <select id="f-genre">
              <option>Fiction</option><option>Non-Fiction</option><option>Science Fiction</option>
              <option>History</option><option>Biography</option><option>Mystery</option>
              <option>Poetry</option><option>Classics</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="f-cover">Cover image</label><input type="file" id="f-cover" accept="image/*"></div>
        <div class="field"><label for="f-mainidea">Main idea</label><textarea id="f-mainidea" rows="2" required></textarea></div>
        <div class="field"><label for="f-themes">Themes (comma-separated)</label><input type="text" id="f-themes" placeholder="Memory, Isolation, Truth"></div>
        <div class="field"><label for="f-characters">Characters (one per line: Name | Role | Note)</label><textarea id="f-characters" rows="3" placeholder="Elias Kade | Lighthouse keeper | Meticulous and guarded"></textarea></div>
        <div class="field"><label for="f-setting">Setting</label><textarea id="f-setting" rows="2"></textarea></div>
        <div class="field"><label for="f-plot">Plot</label><textarea id="f-plot" rows="3"></textarea></div>
        <div class="field"><label for="f-conflict">Conflict</label><textarea id="f-conflict" rows="2"></textarea></div>
        <div class="field"><label for="f-resolution">Resolution</label><textarea id="f-resolution" rows="2"></textarea></div>
        <div class="field"><label for="f-moral">Moral / Lesson</label><textarea id="f-moral" rows="2"></textarea></div>
        <div class="field"><label for="f-summary">Summary</label><textarea id="f-summary" rows="3" required></textarea></div>

        <div class="flex gap-3" style="margin-top:var(--sp-5);">
          <button type="button" class="btn btn-ghost btn-block" id="cancel-book-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save book</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/teacher-dashboard.js"></script>
</body>
</html>
